# Releases the terminal app (cli/) as standalone executables, like Tiller's releases. A push to main
# that changes the terminal app or the server code it runs publishes the next version, creating the
# tag. The next version is the latest release with the patch number raised (v0.1.0 → v0.1.1), or
# package.json's version when that's higher, which is how to move to a new minor or major version.
# Nothing is committed back; the version is baked into the builds. "Run workflow" on the Actions tab
# releases by hand.
name: Release the terminal app

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-cli.js'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

# Releases go one at a time, so two quick merges get two versions in order.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh release list --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // "v0.0.0"')"
          version="$(node -e '
            const [latest, pkg] = process.argv.slice(1).map((v) => v.replace(/^v/, "").split(".").map(Number));
            const newer = pkg[0] - latest[0] || pkg[1] - latest[1] || pkg[2] - latest[2];
            console.log((newer > 0 ? pkg : [latest[0], latest[1], latest[2] + 1]).join("."));
          ' "$latest" "$(node -p "require('./package.json').version")")"
          echo "Latest release $latest; releasing v$version."
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # scripts/build-cli.js bakes package.json's version into the executables.
      - run: npm version "${{ steps.next.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: bun scripts/build-cli.js --all
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      # Creates the tag on this commit too.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.next.outputs.version }}
        run: gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Keel $TAG" --generate-notes
