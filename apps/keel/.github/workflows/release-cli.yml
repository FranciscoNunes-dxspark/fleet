# Releases the terminal app (cli/) as standalone executables, like Tiller's releases. A push to main
# that changes the terminal app or the server code it runs publishes the next version, creating the
# tag. The next version is the latest release with the patch number raised (v0.1.0 → v0.1.1), or
# package.json's version when that's higher, which is how to move to a new minor or major version.
# Nothing is committed back; the version is baked into the builds. "Run workflow" on the Actions tab
# releases by hand.
name: Release the terminal app

on:
  push:
    branches: [main]
    paths:
      - 'bin/**'
      - 'cli/**'
      - 'server/**'
      - 'assets/pinch.ico'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-cli.js'
      - '.github/workflows/release-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

# Releases go one at a time, so two quick merges get two versions in order.
concurrency:
  group: release-cli
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Next version
        id: next
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the terminal app's own tags (v1.2.3): the Android app's releases are tagged android-v….
          latest="$(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '[.[].tagName | select(startswith("v"))][0] // "v0.0.0"')"
          version="$(node -e '
            const [latest, pkg] = process.argv.slice(1).map((v) => v.replace(/^v/, "").split(".").map(Number));
            const newer = pkg[0] - latest[0] || pkg[1] - latest[1] || pkg[2] - latest[2];
            console.log((newer > 0 ? pkg : [latest[0], latest[1], latest[2] + 1]).join("."));
          ' "$latest" "$(node -p "require('./package.json').version")")"
          echo "Latest release $latest; releasing v$version."
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          # Bun only embeds the Windows icon (assets/pinch.ico) when it builds on Windows.
          - os: windows-latest
            targets: bun-windows-x64
          - os: ubuntu-latest
            targets: bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # scripts/build-cli.js bakes package.json's version into the executables.
      - run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: bun scripts/build-cli.js ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: release/

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt
      # Creates the tag on this commit too.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "Keel $TAG" --generate-notes
