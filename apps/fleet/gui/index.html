<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet</title>
<link rel="icon" href="logo/fleet.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="shell">
  <nav id="rail" aria-label="The apps">
    <div id="brand" title="Fleet"><img src="logo/fleet.svg" alt=""><span>Fleet</span></div>
    <div id="spaces" role="tablist"></div>
    <div id="tools">
      <button type="button" data-tool="split" title="Two apps side by side (ctrl+] |)"><span class="ico">◫</span><span class="label">Split</span></button>
      <button type="button" data-tool="runbooks" title="Runbooks (ctrl+] r)"><span class="ico">☰</span><span class="label">Runbooks</span></button>
      <button type="button" data-tool="trace" title="Follow a request across the apps (ctrl+] f)"><span class="ico">⌁</span><span class="label">Follow</span></button>
      <button type="button" data-tool="palette" title="Everything Fleet does (ctrl+shift+p)"><span class="ico">⌘</span><span class="label">Commands</span></button>
      <button type="button" data-tool="help" title="The keys (ctrl+] ?)"><span class="ico">?</span><span class="label">Keys</span></button>
      <button type="button" id="folder" data-tool="move" title="The folder the fleet runs in: click to move every app (ctrl+] m)"><span class="ico">▤</span><span class="label" id="folder-name"></span></button>
    </div>
  </nav>
  <main id="stage"></main>
  <aside id="drawer" hidden></aside>
</div>
<div id="hint" hidden></div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div id="modal-box" role="dialog" aria-modal="true"></div></div>
<textarea id="keys" aria-label="Keys for the app on screen" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
<span id="measure" aria-hidden="true">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
<script type="module" src="app.js"></script>
</body>
</html>
