<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fleet</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top" data-tauri-drag-region>
    <span class="brand" data-tauri-drag-region><img src="mark.svg" alt="" width="16" height="16"> fleet</span>
    <nav class="tabs" id="tabs" aria-label="Apps"></nav>
    <button type="button" class="add" id="add" title="Choose the apps on the bar (prefix a)" aria-label="Choose the apps on the bar">+</button>
    <span class="spacer" data-tauri-drag-region></span>
    <span class="status" id="status"></span>
    <span class="where" id="where"></span>
    <button type="button" class="side-toggle" id="toggle-projects" aria-pressed="false" title="Projects: the folders the fleet was in">projects</button>
    <button type="button" class="side-toggle" id="toggle-claude" aria-pressed="false" title="Ask Claude about what changed">claude</button>
    <span class="caption" aria-label="Window">
      <button type="button" id="win-min" title="Minimise" aria-label="Minimise">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"/></svg>
      </button>
      <button type="button" id="win-max" title="Maximise" aria-label="Maximise">
        <svg class="maximise" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg>
        <svg class="restore" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.5" y="2.5" width="7" height="7"/><path d="M2.5 2.5v-2h7v7h-2"/></svg>
      </button>
      <button type="button" id="win-close" class="close-window" title="Close Fleet" aria-label="Close">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg>
      </button>
    </span>
  </header>
  <div class="middle">
    <main id="terminal" aria-label="Fleet"></main>
    <aside class="side" id="side-projects" hidden aria-label="Projects">
      <h3>PROJECTS</h3>
      <div class="list" id="projects"></div>
      <div class="actions">
        <button type="button" class="item" id="open-folder">Open folder…</button>
      </div>
    </aside>
    <aside class="side" id="side-claude" hidden aria-label="Claude">
      <h3>CLAUDE</h3>
      <form class="field-row" id="claude-form">
        <span class="sign" aria-hidden="true">?</span>
        <input id="claude-input" autocomplete="off" placeholder="what broke, or why…" aria-label="Ask Claude">
      </form>
      <div class="list" id="claude"></div>
      <div class="actions">
        <button type="button" class="item" id="claude-proposals">Claude's proposals</button>
      </div>
    </aside>
  </div>
  <footer class="strip" id="strip">
    <span class="say" id="say"></span>
    <span class="tools" id="tools">
      <button type="button" id="open-palette" title="Every app's commands and Fleet's (ctrl+k)">^K palette</button>
      <button type="button" data-key="w" title="What changed lately, across the apps (prefix w)">changed</button>
      <button type="button" data-key="f" title="Follow a request through every app (prefix f)">follow</button>
      <button type="button" data-key="r" title="Runbooks (prefix r)">runbooks</button>
      <button type="button" data-key="S" title="Security across the apps (prefix S)">security</button>
      <button type="button" data-key="e" title="The project's environment (prefix e)">env</button>
      <button type="button" data-key="|" title="Two apps side by side (prefix |)">split</button>
      <button type="button" id="open-settings" title="Settings">settings</button>
      <button type="button" data-key="?" title="Every key (prefix ?)">?</button>
    </span>
  </footer>
  <div class="scrim" id="scrim" hidden>
    <section class="box" id="box" role="dialog" aria-modal="true" aria-labelledby="box-title">
      <header class="box-head">
        <span class="mark" aria-hidden="true">▍</span>
        <h2 id="box-title"></h2>
        <button type="button" class="close" id="box-close" aria-label="Close">esc ×</button>
      </header>
      <div id="box-top"></div>
      <div class="box-body" id="box-body"></div>
      <footer class="box-keys" id="box-keys"></footer>
    </section>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="ended" id="ended" hidden>
    <p id="ended-text">Fleet ended.</p>
    <button type="button" id="again">↵ start it again</button>
  </div>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-webgl.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="vendor/addon-image.js"></script>
  <script src="app.js"></script>
</body>
</html>
