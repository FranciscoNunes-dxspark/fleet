# Fleet's desktop window (desktop/): its installers, built on each platform with Fleet's own executable
# inside (desktop/scripts/sidecar.mjs), unsigned, kept as the run's artifacts. On main, once the
# updater's private key is a secret (TAURI_SIGNING_PRIVATE_KEY), each run is also a release,
# desktop-v<version>, with the bundles and their signatures, and desktop-latest's latest.json says so:
# the windows already installed look there and update themselves (desktop/README.md, "Updates").
# Fleet's apps are inside the window, so a change to any of them, the kit or patches/ is a new window
# on main; elsewhere only a change to desktop/ builds one.
name: Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
      - 'apps/**'
      - 'packages/kit/**'
      - 'patches/**'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          main=false; [ "$GITHUB_REF" = refs/heads/main ] && main=true
          # Off main, only the window's own changes (or a run by hand) build it.
          build=true
          if [ "$main" = false ] && [ "$GITHUB_EVENT_NAME" = push ] && ! git diff --name-only HEAD~1 HEAD | grep -qE '^(desktop/|\.github/workflows/desktop\.yml)'; then build=false; fi
          release=false
          if [ "$main" = true ] && [ "$build" = true ]; then
            if [ "$HAS_KEY" = true ]; then release=true; else echo "::notice::No TAURI_SIGNING_PRIVATE_KEY secret: the installers are built, but not released for the updater."; fi
          fi
          version=$(gh release list --limit 100 --json tagName -q '.[].tagName' | node desktop/scripts/version.mjs)
          echo "build=$build release=$release version=$version"
          { echo "build=$build"; echo "release=$release"; echo "version=$version"; } >> "$GITHUB_OUTPUT"

  bundle:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than the newest: an AppImage runs on systems at least as new as the one it was built on.
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: The web view's libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      # The runners come with rustup; stable is what the window is built with.
      - run: rustup default stable
      - run: npm ci
      - name: Fleet, then the window and its installers
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          RELEASE: ${{ needs.plan.outputs.release }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ needs.plan.outputs.release == 'true' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          node scripts/vendor.mjs
          node scripts/sidecar.mjs
          # The version this run releases; a release also makes the signed files the updater installs.
          echo "{\"version\": \"$VERSION\"}" > src-tauri/version.json
          configs=(--config src-tauri/tauri.bundle.json --config src-tauri/version.json)
          if [ "$RELEASE" = true ]; then configs+=(--config src-tauri/tauri.release.json); else unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; fi
          npx --yes @tauri-apps/cli@2.12.3 build "${configs[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage*
            desktop/src-tauri/target/release/bundle/msi/*.msi*
            desktop/src-tauri/target/release/bundle/nsis/*.exe*
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz*
          if-no-files-found: error

  release:
    needs: [plan, bundle]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: release-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
      - name: desktop-v<version>, and desktop-latest's latest.json pointing at it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          node desktop/scripts/latest-json.mjs "$VERSION" bundles > latest.json
          cat latest.json
          # Never marked latest: GitHub's "latest release" is whichever app released last, and the apps'
          # own updater goes by their tags, never by that.
          find bundles -type f -print0 | xargs -0 gh release create "desktop-v$VERSION" --title "Fleet desktop $VERSION" --notes "Fleet in a window of its own, with every app inside. Installed windows update themselves to this one." --latest=false --target "$GITHUB_SHA"
          gh release view desktop-latest >/dev/null 2>&1 || gh release create desktop-latest --title "Fleet desktop: what the updater reads" --notes "latest.json, which every installed window checks: it names the newest desktop-v… release." --latest=false --target "$GITHUB_SHA"
          gh release upload desktop-latest latest.json --clobber
